{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "farseer.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml (required "httpRoute.parentRefs is required" .Values.httpRoute.parentRefs) | nindent 4 }}
  hostnames:
    {{- toYaml (required "httpRoute.hostnames is required" .Values.httpRoute.hostnames) | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Release.Name }}
          port: 80
{{- end }}
