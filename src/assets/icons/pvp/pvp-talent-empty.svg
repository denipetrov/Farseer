<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 116 104">
  <!-- PvP talent, empty slot (green), after the game's slot: a bright green octagonal frame with
       a soft glow, a dark field, a teal-green plus, and green arrows on both sides, joined to the
       frame. Fixed colours. -->
  <defs>
    <filter id="rw-pvp-talent-empty-glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="rw-pvp-talent-empty-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <linearGradient id="rw-pvp-talent-empty-band" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="0" y2="92">
      <stop offset="0" stop-color="#5cff4c"/><stop offset=".5" stop-color="#1ee81e"/><stop offset="1" stop-color="#10b010"/></linearGradient>
    <radialGradient id="rw-pvp-talent-empty-field" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#2c3224"/><stop offset="1" stop-color="#15180f"/></radialGradient>
    <linearGradient id="rw-pvp-talent-empty-plus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3aa892"/><stop offset=".45" stop-color="#1fa262"/><stop offset="1" stop-color="#0d6a52"/></linearGradient>
    <linearGradient id="rw-pvp-talent-empty-arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3cff3c"/><stop offset=".55" stop-color="#1ed81e"/><stop offset="1" stop-color="#0a8a0a"/></linearGradient>
  </defs>
  <path d="M19.4 34.2L38.8 14.8H77.2L96.6 34.2M19.4 69.8L38.8 89.2H77.2L96.6 69.8" fill="none" stroke="#1eff1e" stroke-width="9" opacity=".8" filter="url(#rw-pvp-talent-empty-glow)"/>
  <path d="M19.4 34.2L38.8 14.8H77.2L96.6 34.2M19.4 69.8L38.8 89.2H77.2L96.6 69.8" fill="none" stroke="url(#rw-pvp-talent-empty-band)" stroke-width="5.6" stroke-linejoin="miter"/>
  <polygon points="40,19.4 76,19.4 92,35.4 92,68.6 76,84.6 40,84.6 24,68.6 24,35.4" fill="url(#rw-pvp-talent-empty-field)" stroke="#000" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M52.4 30.2H63.6V46.2H79.6V57.4H63.6V74.2H52.4V57.4H36.4V46.2H52.4Z" fill="url(#rw-pvp-talent-empty-plus)" stroke="#0a2a1c" stroke-width=".8" stroke-linejoin="round"/>
  <path d="M53.6 31.4H62.4V33.2H53.6ZM37.6 47.4H51.2V49H37.6Z" fill="#7fd8c0" opacity=".45"/>
  <path d="M20.2 32.2V71.8L3.4 52ZM95.8 32.2V71.8L112.6 52Z" fill="url(#rw-pvp-talent-empty-arrow)" stroke="#063806" stroke-width="1" stroke-linejoin="round"/>
</svg>
